workflows:
  # ── Fluxo 1: build gratuito, SEM assinatura, para reassinar com Sideloadly ──
  # Gera um .ipa sem certificado nenhum (CODE_SIGNING_ALLOWED=NO). Não usa,
  # não pede e não guarda nenhuma credencial da Apple. O Sideloadly é quem
  # assina o pacote depois, no Windows, com o Apple ID gratuito do usuário.
  ios-free-sideload:
    name: "iOS - build gratis para Sideloadly (sem assinatura)"
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        # Crie este grupo em Codemagic > Team settings > Environment variables
        # com EXPO_PUBLIC_SUPABASE_URL e EXPO_PUBLIC_SUPABASE_ANON_KEY (os
        # mesmos valores do seu .env.production.local). Nao sao credenciais
        # Apple — sao a URL/chave publica (anon) do Supabase.
        - supabase_env
      node: 20.18.1
      vars:
        EXPO_NO_GIT_STATUS: "1"
    cache:
      cache_paths:
        - node_modules
        - ~/Library/Caches/CocoaPods
        - ios/Pods
    scripts:
      - name: Instalar dependencias JS
        script: |
          npm ci --legacy-peer-deps

      - name: Gravar .env (chaves publicas do Supabase)
        script: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          } > "$CM_BUILD_DIR/.env"

      - name: Gerar projeto nativo iOS (expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Remover entitlement de Push (conta Apple gratuita nao suporta)
        script: |
          # Apple so libera a capability "Push Notifications" pra contas
          # Developer Program pagas. Com o entitlement presente, o Sideloadly
          # pode falhar ao assinar com o Apple ID gratuito. Como push remoto
          # nao funciona de graca de qualquer forma, removemos aqui — nao
          # afeta o restante do app (login, fotos, classes, pontuacao etc).
          ENTITLEMENTS_FILE=$(find "$CM_BUILD_DIR/ios" -maxdepth 2 -name "*.entitlements" | head -n1)
          if [ -n "$ENTITLEMENTS_FILE" ]; then
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ENTITLEMENTS_FILE" || true
            echo "Entitlements ajustados: $ENTITLEMENTS_FILE"
            cat "$ENTITLEMENTS_FILE"
          else
            echo "Nenhum .entitlements encontrado (ok, nada a remover)."
          fi

      - name: Instalar CocoaPods
        script: |
          cd "$CM_BUILD_DIR/ios"
          pod install

      - name: Descobrir workspace e scheme gerados pelo prebuild
        script: |
          set -e
          # "ls *.xcworkspace" lista o CONTEUDO da pasta quando o glob casa um
          # diretorio (nao o nome dela) — foi isso que pegou o arquivo interno
          # contents.xcworkspacedata em vez do proprio .xcworkspace. Usar find
          # com -maxdepth 1 evita entrar no bundle (e na pasta Pods).
          WORKSPACE_PATH=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -type d -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "ERRO: nenhum .xcworkspace encontrado na raiz de $CM_BUILD_DIR/ios."
            echo "Confira se as etapas de prebuild e pod install rodaram sem erro."
            exit 1
          fi
          IOS_WORKSPACE=$(basename "$WORKSPACE_PATH")
          echo "Workspace encontrado: $IOS_WORKSPACE"

          echo "--- Todos os schemes visiveis no workspace ---"
          (cd "$CM_BUILD_DIR/ios" && xcodebuild -workspace "$IOS_WORKSPACE" -list 2>/dev/null) || true

          # O 1o scheme de "xcodebuild -list" pode ser de uma dependencia do
          # Expo/Pods (ex.: EXApplication) em vez do app — ja aconteceu aqui.
          # O scheme certo do app e um .xcscheme COMPARTILHADO dentro do
          # .xcodeproj do proprio app (nao em Pods/*.xcodeproj), entao vamos
          # direto no arquivo em vez de confiar na ordem do "-list".
          SCHEME_FILE=$(find "$CM_BUILD_DIR/ios" -path "*/Pods/*" -prune -o \
            -path "*.xcodeproj/xcshareddata/xcschemes/*.xcscheme" -print 2>/dev/null | head -n 1)

          if [ -z "$SCHEME_FILE" ]; then
            echo "ERRO: nenhum .xcscheme compartilhado encontrado fora de Pods,"
            echo "em ios/*.xcodeproj/xcshareddata/xcschemes/*.xcscheme."
            exit 1
          fi

          IOS_SCHEME=$(basename "$SCHEME_FILE" .xcscheme)
          echo "Scheme escolhido (do .xcodeproj do app, fora de Pods): $IOS_SCHEME"

          case "$IOS_SCHEME" in
            EXApplication|ExpoModulesCore|React-*|Pods-*)
              echo "ERRO: scheme '$IOS_SCHEME' e uma dependencia (Expo/Pods/React), nao o app."
              exit 1
              ;;
          esac

          # Confirma que esse scheme realmente produz um .app antes de gastar
          # tempo de build com ele.
          WRAPPER_EXT=$(cd "$CM_BUILD_DIR/ios" && xcodebuild -workspace "$IOS_WORKSPACE" -scheme "$IOS_SCHEME" \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk -F'= ' '/ WRAPPER_EXTENSION /{print $2; exit}' | tr -d ' ')

          echo "WRAPPER_EXTENSION do scheme '$IOS_SCHEME': $WRAPPER_EXT"

          if [ "$WRAPPER_EXT" != "app" ]; then
            echo "ERRO: o scheme '$IOS_SCHEME' nao produz um .app (WRAPPER_EXTENSION='$WRAPPER_EXT')."
            echo "Nao vou compilar com ele — corrija a deteccao do scheme."
            exit 1
          fi

          echo "IOS_WORKSPACE=$IOS_WORKSPACE" >> "$CM_ENV"
          echo "IOS_SCHEME=$IOS_SCHEME" >> "$CM_ENV"

      - name: Compilar para iPhone real SEM assinatura de codigo
        script: |
          cd "$CM_BUILD_DIR/ios"
          xcodebuild build \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Empacotar .ipa nao assinado (Payload/*.app)
        script: |
          set -e
          PRODUCTS_ROOT="$CM_BUILD_DIR/ios/build/Build/Products"
          echo "Procurando .app sob: $PRODUCTS_ROOT"

          # find (em vez de "ls -d *.app" a partir de um cd fixo) para nao
          # depender do nome exato da pasta de configuracao (Release-iphoneos)
          # e pegar o .app onde quer que o xcodebuild tenha colocado.
          APP_PATH=$(find "$PRODUCTS_ROOT" -maxdepth 3 -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERRO: nenhum .app encontrado sob $PRODUCTS_ROOT."
            echo "Conteudo encontrado:"
            find "$PRODUCTS_ROOT" -maxdepth 3 2>/dev/null || echo "(pasta nao existe)"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH")
          APP_SIZE_KB=$(du -sk "$APP_PATH" | cut -f1)
          echo "App encontrado: $APP_PATH ($(du -sh "$APP_PATH" | cut -f1))"

          if [ -z "$APP_SIZE_KB" ] || [ "$APP_SIZE_KB" -lt 1 ]; then
            echo "ERRO: $APP_PATH nao existe ou esta vazio."
            exit 1
          fi

          WORKDIR="$CM_BUILD_DIR/ios/ipa-package"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/Payload"
          cp -R "$APP_PATH" "$WORKDIR/Payload/$APP_NAME"

          COPIED_SIZE_KB=$(du -sk "$WORKDIR/Payload/$APP_NAME" | cut -f1)
          echo "Copiado para Payload/$APP_NAME ($(du -sh "$WORKDIR/Payload/$APP_NAME" | cut -f1))"
          if [ -z "$COPIED_SIZE_KB" ] || [ "$COPIED_SIZE_KB" -lt 1 ]; then
            echo "ERRO: copia para Payload/$APP_NAME falhou ou ficou vazia."
            exit 1
          fi

          IPA_PATH="$CM_BUILD_DIR/gsf-clubes-unsigned.ipa"
          rm -f "$IPA_PATH"
          (cd "$WORKDIR" && zip -r -y "$IPA_PATH" Payload)

          echo "--- Conteudo do IPA (unzip -l) ---"
          unzip -l "$IPA_PATH"

          IPA_SIZE_BYTES=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH")
          echo "Tamanho do IPA: $IPA_SIZE_BYTES bytes"

          if [ -z "$IPA_SIZE_BYTES" ] || [ "$IPA_SIZE_BYTES" -lt 1048576 ]; then
            echo "ERRO: IPA gerado tem menos de 1MB ($IPA_SIZE_BYTES bytes) — provavelmente vazio ou incompleto."
            exit 1
          fi

          echo "IPA valido gerado em: $IPA_PATH"

    artifacts:
      - gsf-clubes-unsigned.ipa

  # ── Fluxo 2: build assinado (App Store Connect API), destino TestFlight ──
  # Conta Apple Developer Program paga + app ja criado no App Store Connect
  # (com.slowdev.gsfdbv). Usa a integracao "Codemagic GSF" (App Store Connect
  # API key ja cadastrada na interface do Codemagic) para assinatura
  # automatica e publicacao — nenhuma credencial Apple entra neste arquivo.
  ios-app-store-production:
    name: "iOS - TestFlight / App Store (producao, assinado)"
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic GSF
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.slowdev.gsfdbv
      groups:
        # Mesmo grupo do workflow gratuito (URL/chave publica do Supabase).
        - supabase_env
      node: 20.18.1
      vars:
        EXPO_NO_GIT_STATUS: "1"
    cache:
      cache_paths:
        - node_modules
        - ~/Library/Caches/CocoaPods
        - ios/Pods
    scripts:
      - name: Instalar dependencias JS
        script: |
          npm ci --legacy-peer-deps

      - name: Gravar .env (chaves publicas do Supabase)
        script: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          } > "$CM_BUILD_DIR/.env"

      - name: Gerar projeto nativo iOS (expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean --no-install

      # Sem etapa de remover o entitlement de Push aqui: conta paga suporta
      # push de verdade, entao as capabilities nativas do app (Push
      # Notifications incluida) ficam intactas, como geradas pelo prebuild.

      - name: Instalar CocoaPods
        script: |
          cd "$CM_BUILD_DIR/ios"
          pod install

      - name: Descobrir workspace e scheme gerados pelo prebuild
        script: |
          set -e
          # Mesma logica de deteccao do workflow gratuito: "ls *.xcworkspace"
          # lista o CONTEUDO da pasta quando o glob casa um diretorio, entao
          # usamos find. E o 1o scheme de "xcodebuild -list" pode ser de uma
          # dependencia (Expo/Pods) em vez do app, entao vamos direto no
          # .xcscheme compartilhado do .xcodeproj do proprio app.
          WORKSPACE_PATH=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -type d -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "ERRO: nenhum .xcworkspace encontrado na raiz de $CM_BUILD_DIR/ios."
            echo "Confira se as etapas de prebuild e pod install rodaram sem erro."
            exit 1
          fi
          IOS_WORKSPACE=$(basename "$WORKSPACE_PATH")
          echo "Workspace encontrado: $IOS_WORKSPACE"

          echo "--- Todos os schemes visiveis no workspace ---"
          (cd "$CM_BUILD_DIR/ios" && xcodebuild -workspace "$IOS_WORKSPACE" -list 2>/dev/null) || true

          SCHEME_FILE=$(find "$CM_BUILD_DIR/ios" -path "*/Pods/*" -prune -o \
            -path "*.xcodeproj/xcshareddata/xcschemes/*.xcscheme" -print 2>/dev/null | head -n 1)

          if [ -z "$SCHEME_FILE" ]; then
            echo "ERRO: nenhum .xcscheme compartilhado encontrado fora de Pods,"
            echo "em ios/*.xcodeproj/xcshareddata/xcschemes/*.xcscheme."
            exit 1
          fi

          IOS_SCHEME=$(basename "$SCHEME_FILE" .xcscheme)
          echo "Scheme escolhido (do .xcodeproj do app, fora de Pods): $IOS_SCHEME"

          case "$IOS_SCHEME" in
            EXApplication|ExpoModulesCore|React-*|Pods-*)
              echo "ERRO: scheme '$IOS_SCHEME' e uma dependencia (Expo/Pods/React), nao o app."
              exit 1
              ;;
          esac

          # Confirma que o scheme realmente produz um .app (WRAPPER_EXTENSION)
          # antes de gastar tempo de archive/export com ele.
          WRAPPER_EXT=$(cd "$CM_BUILD_DIR/ios" && xcodebuild -workspace "$IOS_WORKSPACE" -scheme "$IOS_SCHEME" \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk -F'= ' '/ WRAPPER_EXTENSION /{print $2; exit}' | tr -d ' ')

          echo "WRAPPER_EXTENSION do scheme '$IOS_SCHEME': $WRAPPER_EXT"

          if [ "$WRAPPER_EXT" != "app" ]; then
            echo "ERRO: o scheme '$IOS_SCHEME' nao produz um .app (WRAPPER_EXTENSION='$WRAPPER_EXT')."
            echo "Nao vou compilar com ele — corrija a deteccao do scheme."
            exit 1
          fi

          echo "IOS_WORKSPACE=$IOS_WORKSPACE" >> "$CM_ENV"
          echo "IOS_SCHEME=$IOS_SCHEME" >> "$CM_ENV"

      - name: Aplicar numero de build nativo do Codemagic ao projeto
        script: |
          set -euo pipefail
          # $BUILD_NUMBER e uma variavel automatica do Codemagic: inteiro > 0,
          # crescente a cada execucao deste workflow, sem depender de consultar
          # o App Store Connect (o comando "get-latest-testflight-build-number"
          # espera o Apple ID numerico do app — APP_STORE_APPLE_ID — nao o
          # bundle id, e exigiria cadastrar mais uma variavel; evitamos isso
          # usando o contador que o proprio Codemagic ja fornece de graca).
          #
          # CURRENT_PROJECT_VERSION (build setting no project.pbxproj) NAO e
          # suficiente sozinho: o Expo prebuild tambem grava CFBundleVersion
          # como valor LITERAL no Info.plist (nao como referencia
          # $(CURRENT_PROJECT_VERSION)), entao so mexer no pbxproj deixava o
          # IPA final com CFBundleVersion parado no valor antigo — foi por
          # isso que o App Store Connect rejeitou o envio ("bundle version
          # must be higher than previousBundleVersion = 4"). Gravamos os dois
          # e conferimos que o Info.plist realmente ficou com o novo valor.
          if ! [[ "${BUILD_NUMBER:-}" =~ ^[0-9]+$ ]] || [ "$BUILD_NUMBER" -le 0 ]; then
            echo "BUILD_NUMBER invalido: ${BUILD_NUMBER:-ausente}"
            exit 1
          fi

          MAIN_PROJECT="$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name '*.xcodeproj' -type d | head -n 1)"
          PBXPROJ="$MAIN_PROJECT/project.pbxproj"
          INFO_PLIST="$(find "$CM_BUILD_DIR/ios" -mindepth 2 -maxdepth 2 -type f -name 'Info.plist' ! -path '*/Pods/*' | head -n 1)"

          if [ -z "$MAIN_PROJECT" ] || [ ! -f "$PBXPROJ" ]; then
            echo "project.pbxproj principal nao encontrado"
            exit 1
          fi

          if [ ! -f "$INFO_PLIST" ]; then
            echo "Info.plist principal nao encontrado"
            exit 1
          fi

          sed -i '' -E \
            "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" \
            "$PBXPROJ"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$INFO_PLIST"

          PLIST_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"

          if [ "$PLIST_BUILD_NUMBER" != "$BUILD_NUMBER" ]; then
            echo "Falha: CFBundleVersion=$PLIST_BUILD_NUMBER, esperado=$BUILD_NUMBER"
            exit 1
          fi

          echo "CURRENT_PROJECT_VERSION e CFBundleVersion configurados como $BUILD_NUMBER"

      - name: Aplicar perfis de provisionamento somente ao projeto principal
        script: |
          set -e
          # Sem --project, "xcode-project use-profiles" varre o repo inteiro
          # atras de .xcodeproj e tenta assinar TODOS que encontrar — inclusive
          # dependencias como node_modules/@react-native-community/datetimepicker/
          # ios/RNDateTimePicker.xcodeproj, o que quebra o build. Localizamos so
          # o .xcodeproj do app (maxdepth 1 direto em ios/, fora de Pods) e
          # passamos explicitamente, para assinar apenas o projeto principal.
          MAIN_PROJECT="$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name '*.xcodeproj' -type d | head -n 1)"

          if [ -z "$MAIN_PROJECT" ]; then
            echo "Projeto Xcode principal não encontrado em ios/"
            exit 1
          fi

          echo "Aplicando assinatura somente em: $MAIN_PROJECT"
          xcode-project use-profiles --project "$MAIN_PROJECT"

      - name: Gerar archive e IPA assinado para App Store
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios"
          xcode-project build-ipa \
            --workspace "$IOS_WORKSPACE" \
            --scheme "$IOS_SCHEME"

      - name: Validar CFBundleVersion dentro do IPA gerado
        script: |
          set -euo pipefail
          # Confere o Info.plist de dentro do .ipa de verdade (nao so o do
          # projeto antes do archive), para garantir que o valor que vai
          # para o App Store Connect e realmente o esperado.
          IPA_PATH="$(find "$CM_BUILD_DIR/ios/build/ios/ipa" -type f -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "IPA nao encontrado em $CM_BUILD_DIR/ios/build/ios/ipa"
            exit 1
          fi

          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          IPA_PLIST="$(find "$VERIFY_DIR/Payload" -maxdepth 2 -name Info.plist | head -n 1)"
          IPA_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$IPA_PLIST")"

          echo "CFBundleVersion encontrado no IPA: $IPA_BUILD_NUMBER"

          if [ "$IPA_BUILD_NUMBER" != "$BUILD_NUMBER" ]; then
            echo "IPA incorreto: esperado BUILD_NUMBER=$BUILD_NUMBER, encontrado=$IPA_BUILD_NUMBER"
            exit 1
          fi

    artifacts:
      # xcode-project build-ipa roda com "cd $CM_BUILD_DIR/ios" antes, entao a
      # saida fica em $CM_BUILD_DIR/ios/build/ios/ipa — "build/ios/ipa/*.ipa"
      # (sem o prefixo "ios/") nunca batia com nada, por isso o Publishing
      # falhava com "no IPAs or PKGs found" mesmo com o IPA gerado certinho.
      - ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # auth: integration reaproveita a mesma API key da App Store Connect
      # cadastrada na integracao "Codemagic GSF" (declarada em cima, em
      # integrations.app_store_connect) — nenhuma chave/senha entra aqui.
      app_store_connect:
        auth: integration
        # false: so envia (upload) a build pro App Store Connect, sem pedir
        # Beta App Review automatico. A versao 1.0.19 ja foi rejeitada na App
        # Review normal (nao na Beta Review do TestFlight) — pedir Beta
        # Review de novo aqui e o que causa o erro "Another build in the
        # same train is already in beta review" quando ha uma build anterior
        # ainda em fila. A troca da build 9 por esta e o reenvio a App
        # Review continuam manuais, direto no App Store Connect.
        submit_to_testflight: false
        # Envio para revisao publica da App Store fica manual, feito depois
        # pelo proprio App Store Connect quando o app estiver pronto.
        submit_to_app_store: false
