workflows:
  # ── Fluxo 1: build gratuito, SEM assinatura, para reassinar com Sideloadly ──
  # Gera um .ipa sem certificado nenhum (CODE_SIGNING_ALLOWED=NO). Não usa,
  # não pede e não guarda nenhuma credencial da Apple. O Sideloadly é quem
  # assina o pacote depois, no Windows, com o Apple ID gratuito do usuário.
  ios-free-sideload:
    name: "iOS - build gratis para Sideloadly (sem assinatura)"
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        # Crie este grupo em Codemagic > Team settings > Environment variables
        # com EXPO_PUBLIC_SUPABASE_URL e EXPO_PUBLIC_SUPABASE_ANON_KEY (os
        # mesmos valores do seu .env.production.local). Nao sao credenciais
        # Apple — sao a URL/chave publica (anon) do Supabase.
        - supabase_env
      node: 20.18.1
      vars:
        EXPO_NO_GIT_STATUS: "1"
    cache:
      cache_paths:
        - node_modules
        - ~/Library/Caches/CocoaPods
        - ios/Pods
    scripts:
      - name: Instalar dependencias JS
        script: |
          npm ci --legacy-peer-deps

      - name: Gravar .env (chaves publicas do Supabase)
        script: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          } > "$CM_BUILD_DIR/.env"

      - name: Gerar projeto nativo iOS (expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Remover entitlement de Push (conta Apple gratuita nao suporta)
        script: |
          # Apple so libera a capability "Push Notifications" pra contas
          # Developer Program pagas. Com o entitlement presente, o Sideloadly
          # pode falhar ao assinar com o Apple ID gratuito. Como push remoto
          # nao funciona de graca de qualquer forma, removemos aqui — nao
          # afeta o restante do app (login, fotos, classes, pontuacao etc).
          ENTITLEMENTS_FILE=$(find "$CM_BUILD_DIR/ios" -maxdepth 2 -name "*.entitlements" | head -n1)
          if [ -n "$ENTITLEMENTS_FILE" ]; then
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ENTITLEMENTS_FILE" || true
            echo "Entitlements ajustados: $ENTITLEMENTS_FILE"
            cat "$ENTITLEMENTS_FILE"
          else
            echo "Nenhum .entitlements encontrado (ok, nada a remover)."
          fi

      - name: Instalar CocoaPods
        script: |
          cd "$CM_BUILD_DIR/ios"
          pod install

      - name: Descobrir workspace e scheme gerados pelo prebuild
        script: |
          # "ls *.xcworkspace" lista o CONTEUDO da pasta quando o glob casa um
          # diretorio (nao o nome dela) — foi isso que pegou o arquivo interno
          # contents.xcworkspacedata em vez do proprio .xcworkspace. Usar find
          # com -maxdepth 1 evita entrar no bundle (e na pasta Pods).
          WORKSPACE_PATH=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -type d -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "ERRO: nenhum .xcworkspace encontrado na raiz de $CM_BUILD_DIR/ios."
            echo "Confira se as etapas de prebuild e pod install rodaram sem erro."
            exit 1
          fi
          IOS_WORKSPACE=$(basename "$WORKSPACE_PATH")
          IOS_SCHEME=$(cd "$CM_BUILD_DIR/ios" && xcodebuild -workspace "$IOS_WORKSPACE" -list 2>/dev/null \
            | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')

          echo "Workspace encontrado: $IOS_WORKSPACE"
          echo "Scheme encontrado: $IOS_SCHEME"

          if [ -z "$IOS_SCHEME" ]; then
            echo "ERRO: nao foi possivel obter um scheme valido via 'xcodebuild -workspace $IOS_WORKSPACE -list'."
            exit 1
          fi

          echo "IOS_WORKSPACE=$IOS_WORKSPACE" >> "$CM_ENV"
          echo "IOS_SCHEME=$IOS_SCHEME" >> "$CM_ENV"

      - name: Compilar para iPhone real SEM assinatura de codigo
        script: |
          cd "$CM_BUILD_DIR/ios"
          xcodebuild build \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Empacotar .ipa nao assinado (Payload/*.app)
        script: |
          set -e
          PRODUCTS_ROOT="$CM_BUILD_DIR/ios/build/Build/Products"
          echo "Procurando .app sob: $PRODUCTS_ROOT"

          # find (em vez de "ls -d *.app" a partir de um cd fixo) para nao
          # depender do nome exato da pasta de configuracao (Release-iphoneos)
          # e pegar o .app onde quer que o xcodebuild tenha colocado.
          APP_PATH=$(find "$PRODUCTS_ROOT" -maxdepth 3 -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERRO: nenhum .app encontrado sob $PRODUCTS_ROOT."
            echo "Conteudo encontrado:"
            find "$PRODUCTS_ROOT" -maxdepth 3 2>/dev/null || echo "(pasta nao existe)"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH")
          APP_SIZE_KB=$(du -sk "$APP_PATH" | cut -f1)
          echo "App encontrado: $APP_PATH ($(du -sh "$APP_PATH" | cut -f1))"

          if [ -z "$APP_SIZE_KB" ] || [ "$APP_SIZE_KB" -lt 1 ]; then
            echo "ERRO: $APP_PATH nao existe ou esta vazio."
            exit 1
          fi

          WORKDIR="$CM_BUILD_DIR/ios/ipa-package"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/Payload"
          cp -R "$APP_PATH" "$WORKDIR/Payload/$APP_NAME"

          COPIED_SIZE_KB=$(du -sk "$WORKDIR/Payload/$APP_NAME" | cut -f1)
          echo "Copiado para Payload/$APP_NAME ($(du -sh "$WORKDIR/Payload/$APP_NAME" | cut -f1))"
          if [ -z "$COPIED_SIZE_KB" ] || [ "$COPIED_SIZE_KB" -lt 1 ]; then
            echo "ERRO: copia para Payload/$APP_NAME falhou ou ficou vazia."
            exit 1
          fi

          IPA_PATH="$CM_BUILD_DIR/gsf-clubes-unsigned.ipa"
          rm -f "$IPA_PATH"
          (cd "$WORKDIR" && zip -r -y "$IPA_PATH" Payload)

          echo "--- Conteudo do IPA (unzip -l) ---"
          unzip -l "$IPA_PATH"

          IPA_SIZE_BYTES=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH")
          echo "Tamanho do IPA: $IPA_SIZE_BYTES bytes"

          if [ -z "$IPA_SIZE_BYTES" ] || [ "$IPA_SIZE_BYTES" -lt 1048576 ]; then
            echo "ERRO: IPA gerado tem menos de 1MB ($IPA_SIZE_BYTES bytes) — provavelmente vazio ou incompleto."
            exit 1
          fi

          echo "IPA valido gerado em: $IPA_PATH"

    artifacts:
      - gsf-clubes-unsigned.ipa

# O workflow de producao App Store (ios-app-store-production) foi removido daqui
# de proposito: o Codemagic exige que todo workflow declare pelo menos 1
# artifact, e um workflow "bloqueado" sem build real nao tem nada pra declarar.
# Quando a conta Apple Developer Program estiver ativa, criamos esse workflow
# do zero, ja com build + artifacts + code signing configurados de verdade.
